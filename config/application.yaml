app:
  http:
    # Configure APP_HTTP_PUBLIC_BASE_URL per deployment (including the public mount path).
    # OAuth issuer and discovery must never derive their host from the incoming request.
    cors:
      enabled: true
    proxy:
      proxy-address-forwarding: true
      allow-forwarded: true
  event:
    queue:
      topic: lught.events
  rate-limit:
    id: app_global_limit
    policy: sliding_window
    limit: 1500
    interval: 1 minute
    bucket-resolver: Civi\Lughauth\Bootstrap\Middleware\Rate\BaseBucketResolver
    connection-resolver: Civi\Lughauth\Bootstrap\Middleware\Rate\IpGranularityResolver
security:
  # acr values naming each assurance level (task 067), shared by the OIDC server and the APIs.
  # Comma or space separated: the first is issued, published and asked for in step-up
  # challenges; the rest are aliases accepted from other identity providers and relying parties.
  # Override with SECURITY_ACR_SINGLE_FACTOR and SECURITY_ACR_MULTI_FACTOR.
  acr:
    single-factor: urn:lugh:acr:1fa
    multi-factor: urn:lugh:acr:mfa
