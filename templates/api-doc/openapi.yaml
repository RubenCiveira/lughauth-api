      operationId: 05ba1ffa4895f16f997a5ebc04f14e50
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileApiDTO'
        401:
          description: Unauthorized
      security:
        -
          bearerAuth: {  }
    put:
      tags:
        - Profile
      summary: 'Create or update own user profile'
      operationId: 4a281f0bb7156791de936b6f35b297d1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileApiDTO'
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileApiDTO'
        401:
          description: Unauthorized
        422:
          description: 'Constraint error'
      security:
        -
          bearerAuth: {  }
  '/oauth/openid/{tenant}/jwks':
    get:
      tags:
        - OIDC
      summary: 'JSON Web Key Set'
      description: 'Public keys for JWT signature verification. Cached for 1 hour.'
      operationId: 295794607bd2205ebcfd8fd37dfe8668
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: JWKS
          content:
            application/json:
              schema:
                properties:
                  keys:
                    type: array
                    items:
                      properties:
                        kty:
                          type: string
                          example: RSA
                        use:
                          type: string
                          example: sig
                        kid:
                          type: string
                        alg:
                          type: string
                          example: RS256
                        'n':
                          type: string
                        e:
                          type: string
                      type: object
                type: object
  '/oauth/openid/{tenant}/webauthn/register/begin':
    post:
      tags:
        - WebAuthn
      summary: 'Begin WebAuthn credential registration'
      operationId: c9bb67cc5f9ea54edb41564b92683a46
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: PublicKeyCredentialCreationOptions
        401:
          description: Unauthenticated
  '/oauth/openid/{tenant}/webauthn/register/finish':
    post:
      tags:
        - WebAuthn
      summary: 'Finish WebAuthn credential registration'
      operationId: 51bba2c7da30772b7e77086fe932f870
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Registration successful'
        400:
          description: 'Verification failed'
        401:
          description: Unauthenticated
  '/oauth/openid/{tenant}/webauthn/authenticate/begin':
    post:
      tags:
        - WebAuthn
      summary: 'Begin WebAuthn authentication'
      operationId: 9754112cdb8974de61d0be4a2219fa42
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: PublicKeyCredentialRequestOptions
  '/oauth/openid/{tenant}/webauthn/authenticate/finish':
    post:
      tags:
        - WebAuthn
      summary: 'Finish WebAuthn authentication'
      operationId: 8d83a84cdb915426ffb7988615b3741c
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Authentication successful, returns challengeId for OIDC flow'
        401:
          description: 'Assertion verification failed'
