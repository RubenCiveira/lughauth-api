          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpOutboundConfigApiDTO'
        404:
          description: 'Not found'
  '/oauth/openid/{tenant}/authorize':
    get:
      tags:
        - OIDC
      summary: 'Authorization Endpoint — interactive login UI'
      description: 'Returns the HTML login form. Clients must redirect the user-agent here to initiate the Authorization Code flow with PKCE.'
      operationId: c6b8d8a01109abd67ff39b2305ef05cf
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
        -
          name: response_type
          in: query
          required: true
          schema:
            type: string
            example: code
        -
          name: client_id
          in: query
          required: true
          schema:
            type: string
        -
          name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        -
          name: scope
          in: query
          required: true
          schema:
            type: string
            example: 'openid email profile'
        -
          name: code_challenge
          in: query
          required: true
          schema:
            type: string
        -
          name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum:
              - S256
              - plain
        -
          name: state
          in: query
          required: false
          schema:
            type: string
        -
          name: nonce
          in: query
          required: false
          schema:
            type: string
        -
          name: prompt
          in: query
          required: false
          schema:
            type: string
            enum:
              - none
              - login
              - consent
              - select_account
      responses:
        200:
          description: 'HTML login form'
        302:
          description: 'Redirect with authorization code (if session already active)'
    post:
      tags:
        - OIDC
      summary: 'Authorization Endpoint — form submission'
      description: 'Processes login form submissions (credentials, MFA steps). Not intended for direct API calls; called by the browser during the interactive login flow.'
      operationId: 4d86af10092a5e64a3e0d5997119a669
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                step:
                  description: 'Current login step'
                  type: string
                username:
                  type: string
                password:
                  type: string
                csid:
                  description: 'Cross-site ID token'
                  type: string
              type: object
      responses:
        302:
          description: 'Redirect with authorization code on successful login'
        200:
          description: 'HTML form for next login step or error'
  '/oauth/openid/{tenant}/introspect':
    post:
      tags:
        - OIDC
      summary: 'Token Introspection (RFC 7662)'
      description: 'Returns metadata about an access or refresh token. Requires client authentication via HTTP Basic or client_id/client_secret in the body.'
      operationId: b9be94b2dc70067fad4c956afbb1868b
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                token:
                  description: 'Token to introspect'
                  type: string
                token_type_hint:
                  description: 'access_token or refresh_token'
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
              type: object
      responses:
        200:
          description: 'Introspection response'
          content:
            application/json:
              schema:
                properties:
                  active:
                    type: boolean
                  scope:
                    type: string
                  client_id:
                    type: string
                  token_type:
                    type: string
                  exp:
                    type: integer
                  sub:
                    type: string
                  iss:
                    type: string
                  jti:
                    type: string
                  tenant:
                    type: string
                type: object
        400:
          description: 'Missing token parameter'
        401:
          description: 'Client authentication failed'
      security:
        -
          basicAuth: {  }
  '/oauth/openid/{tenant}/logout':
    get:
      tags:
        - OIDC
      summary: 'RP-Initiated Logout'
      description: 'Ends the user session. Dispatches back-channel logout notifications and renders front-channel logout iframes if registered.'
      operationId: 6d791cfdc5b41c8e09adb3c1ffd0867a
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
        -
          name: id_token_hint
          in: query
          required: false
          schema:
            type: string
        -
          name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
        -
          name: client_id
          in: query
          required: false
          schema:
            type: string
        -
          name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        302:
          description: 'Redirect to post_logout_redirect_uri'
        200:
          description: 'Logout page with front-channel iframes'
        400:
          description: 'Invalid request (missing or disallowed redirect URI)'
  '/oauth/openid/{tenant}/revoke':
    post:
      tags:
        - OIDC
      summary: 'Token Revocation (RFC 7009)'
      description: 'Revokes an access or refresh token. Always returns 200 OK even if the token is unknown or already revoked.'
      operationId: 7dc646d4bfd0c203364bba5b106e4816
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                token:
                  description: 'Token to revoke'
                  type: string
                token_type_hint:
                  description: 'access_token or refresh_token'
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
              type: object
      responses:
        200:
          description: 'Token revoked (or already invalid)'
        400:
          description: 'Missing token parameter'
        401:
          description: 'Client authentication failed'
  '/oauth/openid/{tenant}/token':
    post:
      tags:
        - OIDC
      summary: 'OAuth 2.0 Token Endpoint'
      description: 'Exchange authorization code, refresh token, or device code for tokens. Supports: authorization_code, refresh_token, password, client_credentials, urn:ietf:params:oauth:grant-type:device_code'
      operationId: 4947452133a5ab6778324170f2afeaca
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                grant_type:
                  type: string
                  example: authorization_code
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                code_verifier:
                  description: 'PKCE verifier'
                  type: string
                refresh_token:
                  type: string
              type: object
      responses:
        200:
          description: 'Token response'
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                  id_token:
                    type: string
                  refresh_token:
                    type: string
                  scope:
                    type: string
                type: object
        400:
          description: 'OAuth error (invalid_grant, invalid_client, etc.)'
        401:
          description: 'Client authentication failed'
  '/oauth/openid/{tenant}/userinfo':
    get:
      tags:
        - OIDC
      summary: 'OIDC UserInfo Endpoint'
      description: 'Returns claims about the authenticated user. Requires Bearer access token with openid scope.'
      operationId: 7c76b784357aa43ea55b17f7434ddbc3
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'User claims'
          content:
            application/json:
              schema:
                properties:
                  sub:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  given_name:
                    type: string
                  family_name:
                    type: string
                  picture:
                    type: string
                  locale:
                    type: string
                  zoneinfo:
                    type: string
                  phone_number:
                    type: string
                  updated_at:
                    type: integer
                type: object
        401:
          description: Unauthorized
      security:
        -
          bearerAuth: {  }
  '/oauth/openid/{tenant}/register':
    post:
      tags:
        - OIDC
      summary: 'Dynamic Client Registration — RFC 7591'
      description: 'Registers a new OAuth client dynamically. May require an initial_access_token depending on tenant policy.'
      operationId: 1811ade5c7e4ff27a45c6a0f3fc35501
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - redirect_uris
              properties:
                redirect_uris:
                  type: array
                  items:
                    type: string
                client_name:
                  type: string
                grant_types:
                  type: array
                  items:
                    type: string
                response_types:
                  type: array
                  items:
                    type: string
                scope:
                  type: string
                token_endpoint_auth_method:
                  type: string
                logo_uri:
                  type: string
                backchannel_logout_uri:
                  type: string
              type: object
      responses:
        201:
          description: 'Client registered successfully'
        400:
          description: 'Invalid client metadata'
        401:
          description: 'initial_access_token required or invalid'
        403:
          description: 'Registration disabled for this tenant'
  '/oauth/openid/{tenant}/register/{client_id}':
    get:
      tags:
        - OIDC
      summary: 'Read Client Registration — RFC 7592'
      operationId: 9bde528db67b2a65e028d16184c71628
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
        -
          name: client_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Client registration data'
        401:
          description: 'Invalid registration_access_token'
    put:
      tags:
        - OIDC
      summary: 'Update Client Registration — RFC 7592'
      operationId: 38d83ddea792883996e186368dd0c5bb
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
        -
          name: client_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Updated client registration data'
        400:
          description: 'Invalid client metadata'
        401:
          description: 'Invalid registration_access_token'
    delete:
      tags:
        - OIDC
      summary: 'Delete Client Registration — RFC 7592'
      operationId: 2a36003f9c1ceca26f9f86cb8d824e2f
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
        -
          name: client_id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: 'Client deleted'
        401:
          description: 'Invalid registration_access_token'
  '/oauth/openid/{tenant}/.well-known/openid-configuration':
    get:
      tags:
        - OIDC
      summary: 'OpenID Connect Discovery Document'
      description: 'Returns the OpenID Provider Metadata as defined in OpenID Connect Discovery 1.0.'
      operationId: e8b2db270f4c8f094508be656a24fad0
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'OpenID Provider Metadata'
  '/oauth/openid/{tenant}/device':
    post:
      tags:
        - OIDC
      summary: 'Device Authorization Request (RFC 8628)'
      description: 'Initiates the OAuth 2.0 Device Authorization Grant flow. Returns device_code and user_code for the device to display.'
      operationId: e32ad3759486cac9a0b4836496a21c4d
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                client_id:
                  type: string
                scope:
                  type: string
                audience:
                  type: string
              type: object
      responses:
        200:
          description: 'Device authorization response'
          content:
            application/json:
              schema:
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                    example: ABCD-1234
                  verification_uri:
                    type: string
                  verification_uri_complete:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer
                type: object
        400:
          description: 'Invalid request'
        401:
          description: 'Invalid client'
  '/oauth/openid/{tenant}/par':
    post:
      tags:
        - OIDC
      summary: 'Pushed Authorization Request — RFC 9126'
      description: 'Accepts authorization parameters server-to-server and returns a short-lived request_uri. The client then redirects the user-agent to /authorize with only client_id and request_uri.'
      operationId: 93f59c66264feb24bf96828a2e244870
      parameters:
        -
          name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - client_id
                - response_type
                - redirect_uri
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                response_type:
                  type: string
                  example: code
                redirect_uri:
                  type: string
                scope:
                  type: string
                  example: 'openid email'
                state:
                  type: string
                nonce:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum:
                    - S256
                    - plain
              type: object
      responses:
        201:
          description: 'PAR request created'
          content:
            application/json:
              schema:
                properties:
                  request_uri:
                    type: string
                    example: 'urn:ietf:params:oauth:request_uri:abc123'
                  expires_in:
                    type: integer
                    example: 60
                type: object
        400:
          description: 'Invalid request parameters'
        401:
          description: 'Client authentication failed'
  /api/me/profile:
